<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">Barangay Management System Context Diagram</title>
  <desc id="diagram-description">Context diagram for the Barangay Masisisit Management System, showing residents and barangay personnel interacting with the resident portal and management dashboard, the application reading and writing its MySQL database, and the application sending account-related email through an external email service.</desc>
  <defs>
    <linearGradient id="header-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a5a"/>
      <stop offset="1" stop-color="#176b72"/>
    </linearGradient>
    <linearGradient id="system-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7f7"/>
      <stop offset="1" stop-color="#f4f7fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183248" flood-opacity=".10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#247b91"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7254a5"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cb8834"/>
    </marker>
    <marker id="arrow-data" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#468a78"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 2.5px; }
      .heading { font-size: 36px; font-weight: 700; }
      .subtitle { font-size: 17px; }
      .actor-title { font-size: 21px; font-weight: 700; fill: #183248; }
      .actor-sub { font-size: 14px; fill: #647789; }
      .body { font-size: 15px; fill: #3f5365; }
      .small { font-size: 13px; fill: #65798a; }
      .flow-label { font-size: 12px; font-weight: 600; fill: #41576a; }
      .module-title { font-size: 13px; font-weight: 700; fill: #28465b; }
      .module-sub { font-size: 11px; fill: #6b7d8b; }
      .system-title { font-size: 24px; font-weight: 700; fill: #173d53; }
      .system-sub { font-size: 14px; fill: #607989; }
      .boundary-label { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; fill: #39727a; }
      .db-title { font-size: 17px; font-weight: 700; fill: #245c52; }
      .db-sub { font-size: 12px; fill: #678077; }
      .footer { font-size: 13px; fill: #718394; }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#f5f8fb"/>
  <circle cx="1670" cy="85" r="160" fill="#e9f3f3"/>
  <circle cx="1705" cy="50" r="92" fill="#e1eef3" opacity=".7"/>

  <text x="76" y="66" class="eyebrow" fill="#438a8b">BARANGAY MASISISIT · SANCHEZ MIRA, CAGAYAN</text>
  <text x="76" y="119" class="heading" fill="#15384f">Barangay Management System</text>
  <text x="78" y="153" class="subtitle" fill="#64798a">Context diagram · people, system boundary, data store, and external service</text>
  <rect x="1535" y="104" width="190" height="38" rx="19" fill="#e7f0f3"/>
  <text x="1630" y="128" text-anchor="middle" class="eyebrow" fill="#376776" style="font-size:12px;letter-spacing:1.2px">SYSTEM CONTEXT</text>

  <!-- System boundary -->
  <rect x="510" y="207" width="790" height="753" rx="30" fill="url(#system-gradient)" stroke="#8db9b8" stroke-width="2.5" stroke-dasharray="10 8"/>
  <rect x="542" y="188" width="218" height="34" rx="17" fill="#f5f8fb"/>
  <text x="554" y="211" class="boundary-label">SYSTEM BOUNDARY</text>

  <!-- Resident actor -->
  <g filter="url(#shadow)">
    <rect x="70" y="324" width="320" height="244" rx="22" fill="#ffffff"/>
    <path d="M92 324h276a22 22 0 0 1 22 22v9H70v-9a22 22 0 0 1 22-22z" fill="#247b91"/>
  </g>
  <circle cx="113" cy="395" r="25" fill="#e5f3f6"/>
  <circle cx="113" cy="388" r="8" fill="#247b91"/>
  <path d="M97 411c2-10 8-15 16-15s14 5 16 15" fill="none" stroke="#247b91" stroke-width="4" stroke-linecap="round"/>
  <text x="151" y="389" class="actor-title">Resident</text>
  <text x="151" y="414" class="actor-sub">Public-facing portal user</text>
  <line x1="96" y1="438" x2="364" y2="438" stroke="#e6edf1"/>
  <circle cx="101" cy="463" r="3.5" fill="#247b91"/>
  <text x="114" y="468" class="body">Register and manage an account</text>
  <circle cx="101" cy="491" r="3.5" fill="#247b91"/>
  <text x="114" y="496" class="body">Request certificates and appointments</text>
  <circle cx="101" cy="519" r="3.5" fill="#247b91"/>
  <text x="114" y="524" class="body">File complaints or emergency reports</text>
  <circle cx="101" cy="547" r="3.5" fill="#247b91"/>
  <text x="114" y="552" class="body">Track requests and view alerts</text>

  <!-- Barangay personnel actor -->
  <g filter="url(#shadow)">
    <rect x="70" y="661" width="320" height="272" rx="22" fill="#ffffff"/>
    <path d="M92 661h276a22 22 0 0 1 22 22v9H70v-9a22 22 0 0 1 22-22z" fill="#7254a5"/>
  </g>
  <circle cx="113" cy="730" r="25" fill="#f0ebf7"/>
  <path d="M100 739v-10a13 13 0 0 1 26 0v10M97 740h32M105 716v-5h16v5" fill="none" stroke="#7254a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="151" y="724" class="actor-title">Barangay Personnel</text>
  <text x="151" y="749" class="actor-sub">Admin · staff · health · security</text>
  <line x1="96" y1="773" x2="364" y2="773" stroke="#e6edf1"/>
  <circle cx="101" cy="800" r="3.5" fill="#7254a5"/>
  <text x="114" y="805" class="body">Maintain resident and household records</text>
  <circle cx="101" cy="831" r="3.5" fill="#7254a5"/>
  <text x="114" y="836" class="body">Review requests and case statuses</text>
  <circle cx="101" cy="862" r="3.5" fill="#7254a5"/>
  <text x="114" y="867" class="body">Manage emergencies, users, and settings</text>
  <circle cx="101" cy="893" r="3.5" fill="#7254a5"/>
  <text x="114" y="898" class="body">View reports and activity records</text>

  <!-- Main application -->
  <g filter="url(#shadow)">
    <rect x="570" y="252" width="670" height="372" rx="24" fill="#ffffff"/>
  </g>
  <rect x="570" y="252" width="670" height="10" rx="5" fill="url(#header-gradient)"/>
  <circle cx="612" cy="301" r="20" fill="#e7f2f4"/>
  <path d="M603 302h18M612 293v18M606 295l12 14M618 295l-12 14" stroke="#247b91" stroke-width="2.2" stroke-linecap="round"/>
  <text x="646" y="299" class="system-title">Barangay Management System</text>
  <text x="646" y="323" class="system-sub">PHP web application · resident portal and staff dashboard</text>
  <line x1="600" y1="344" x2="1210" y2="344" stroke="#e6edf1"/>

  <text x="600" y="375" class="boundary-label" style="font-size:11px">CORE FUNCTIONS</text>
  <g>
    <rect x="600" y="391" width="286" height="62" rx="13" fill="#f2f7fa" stroke="#e5edf1"/>
    <circle cx="623" cy="422" r="12" fill="#dcecf2"/>
    <path d="M618 422h10M623 417v10" stroke="#247b91" stroke-width="2" stroke-linecap="round"/>
    <text x="645" y="418" class="module-title">Resident records</text>
    <text x="645" y="437" class="module-sub">Profiles and households</text>

    <rect x="906" y="391" width="304" height="62" rx="13" fill="#f2f7fa" stroke="#e5edf1"/>
    <circle cx="929" cy="422" r="12" fill="#e4e9f7"/>
    <path d="M924 416h10v12h-10zM926 419h6M926 422h6M926 425h4" fill="none" stroke="#58699b" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="951" y="418" class="module-title">Certificates &amp; appointments</text>
    <text x="951" y="437" class="module-sub">Requests, review, and status tracking</text>

    <rect x="600" y="465" width="286" height="62" rx="13" fill="#f2f7fa" stroke="#e5edf1"/>
    <circle cx="623" cy="496" r="12" fill="#f8ebdf"/>
    <path d="M623 489v8l5 3" fill="none" stroke="#b67a32" stroke-width="1.8" stroke-linecap="round"/>
    <text x="645" y="492" class="module-title">Complaints &amp; cases</text>
    <text x="645" y="511" class="module-sub">Filing, response, and resolution</text>

    <rect x="906" y="465" width="304" height="62" rx="13" fill="#f2f7fa" stroke="#e5edf1"/>
    <circle cx="929" cy="496" r="12" fill="#fae8e7"/>
    <path d="M929 488l7 13h-14zM929 493v4M929 499v.5" fill="none" stroke="#b9564e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="951" y="492" class="module-title">Emergency reporting &amp; alerts</text>
    <text x="951" y="511" class="module-sub">Resident reports and office broadcasts</text>

    <rect x="600" y="539" width="286" height="62" rx="13" fill="#f2f7fa" stroke="#e5edf1"/>
    <circle cx="623" cy="570" r="12" fill="#eee8f7"/>
    <path d="M623 563v14M616 570h14" stroke="#7254a5" stroke-width="1.8" stroke-linecap="round"/>
    <text x="645" y="566" class="module-title">Accounts &amp; access</text>
    <text x="645" y="585" class="module-sub">Role-based user management</text>

    <rect x="906" y="539" width="304" height="62" rx="13" fill="#f2f7fa" stroke="#e5edf1"/>
    <circle cx="929" cy="570" r="12" fill="#e2f1e9"/>
    <path d="M923 575l4-5 3 2 5-7" fill="none" stroke="#468a78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="951" y="566" class="module-title">Reports, audit &amp; settings</text>
    <text x="951" y="585" class="module-sub">Dashboards, activity logs, configuration</text>
  </g>

  <!-- Internal data store -->
  <path d="M880 624v30" fill="none" stroke="#468a78" stroke-width="2.5" marker-end="url(#arrow-data)"/>
  <path d="M900 654v-30" fill="none" stroke="#468a78" stroke-width="2.5" marker-end="url(#arrow-data)"/>
  <text x="914" y="646" class="small" style="font-size:11px">read / write</text>
  <g filter="url(#shadow)">
    <rect x="680" y="665" width="490" height="207" rx="20" fill="#ffffff"/>
  </g>
  <ellipse cx="744" cy="704" rx="30" ry="10" fill="#e8f3ee" stroke="#75a997" stroke-width="1.5"/>
  <path d="M714 704v43c0 6 13 11 30 11s30-5 30-11v-43M714 726c0 6 13 11 30 11s30-5 30-11" fill="#e8f3ee" stroke="#75a997" stroke-width="1.5"/>
  <ellipse cx="744" cy="704" rx="30" ry="10" fill="#e8f3ee" stroke="#75a997" stroke-width="1.5"/>
  <text x="793" y="710" class="db-title">MySQL database</text>
  <text x="793" y="733" class="db-sub">Persistent application records</text>
  <line x1="710" y1="771" x2="1140" y2="771" stroke="#e8efec"/>
  <text x="710" y="800" class="small">Users · residents · households · certificates · appointments</text>
  <text x="710" y="823" class="small">Complaints · emergency alerts · settings · activity logs</text>
  <text x="710" y="848" class="small">Database: dbbarangaymanagement</text>

  <!-- Resident data flows -->
  <path d="M390 405H510" fill="none" stroke="#247b91" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="396" y="373" width="109" height="25" rx="8" fill="#f5f8fb"/>
  <text x="450" y="390" text-anchor="middle" class="flow-label">Credentials · requests</text>
  <path d="M510 466H390" fill="none" stroke="#247b91" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="396" y="472" width="109" height="39" rx="8" fill="#f5f8fb"/>
  <text x="450" y="488" text-anchor="middle" class="flow-label">Statuses · certificates</text>
  <text x="450" y="503" text-anchor="middle" class="flow-label">· emergency alerts</text>

  <!-- Barangay personnel data flows -->
  <path d="M390 724H510" fill="none" stroke="#7254a5" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="396" y="692" width="109" height="25" rx="8" fill="#f5f8fb"/>
  <text x="450" y="709" text-anchor="middle" class="flow-label">Records · decisions</text>
  <path d="M510 791H390" fill="none" stroke="#7254a5" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <rect x="396" y="798" width="109" height="39" rx="8" fill="#f5f8fb"/>
  <text x="450" y="814" text-anchor="middle" class="flow-label">Dashboards · case details</text>
  <text x="450" y="829" text-anchor="middle" class="flow-label">· audit information</text>

  <!-- External email service -->
  <path d="M1300 723H1410" fill="none" stroke="#cb8834" stroke-width="2.7" marker-end="url(#arrow-amber)"/>
  <rect x="1306" y="673" width="98" height="40" rx="8" fill="#f5f8fb"/>
  <text x="1355" y="689" text-anchor="middle" class="flow-label">Verification, reset</text>
  <text x="1355" y="704" text-anchor="middle" class="flow-label">and account emails</text>
  <g filter="url(#shadow)">
    <rect x="1410" y="625" width="320" height="208" rx="22" fill="#ffffff"/>
    <path d="M1432 625h276a22 22 0 0 1 22 22v9h-320v-9a22 22 0 0 1 22-22z" fill="#cb8834"/>
  </g>
  <circle cx="1460" cy="704" r="25" fill="#fbf0df"/>
  <rect x="1447" y="695" width="26" height="18" rx="3" fill="none" stroke="#b8792b" stroke-width="2"/>
  <path d="M1449 697l11 9 11-9" fill="none" stroke="#b8792b" stroke-width="2" stroke-linejoin="round"/>
  <text x="1499" y="700" class="actor-title">Email Service</text>
  <text x="1499" y="725" class="actor-sub">External provider</text>
  <line x1="1438" y1="750" x2="1702" y2="750" stroke="#e6edf1"/>
  <text x="1440" y="778" class="body">Configured SMTP / email API</text>
  <text x="1440" y="803" class="small">Google Gmail API or SendGrid</text>
  <text x="1440" y="823" class="small">used for supported account messages</text>

  <!-- Legend and note -->
  <line x1="78" y1="1002" x2="1722" y2="1002" stroke="#dfe7ec"/>
  <text x="80" y="1041" class="footer" style="font-weight:700;fill:#526a7b">FLOW KEY</text>
  <line x1="170" y1="1036" x2="220" y2="1036" stroke="#247b91" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="232" y="1041" class="footer">Resident interactions</text>
  <line x1="390" y1="1036" x2="440" y2="1036" stroke="#7254a5" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="452" y="1041" class="footer">Personnel interactions</text>
  <line x1="630" y1="1036" x2="680" y2="1036" stroke="#468a78" stroke-width="2.5" marker-end="url(#arrow-data)"/>
  <text x="692" y="1041" class="footer">Internal database access</text>
  <line x1="890" y1="1036" x2="940" y2="1036" stroke="#cb8834" stroke-width="2.5" marker-end="url(#arrow-amber)"/>
  <text x="952" y="1041" class="footer">Outbound email integration</text>
  <text x="1720" y="1075" text-anchor="end" class="footer">Prepared from the application’s implemented workflows and integrations</text>
</svg>
